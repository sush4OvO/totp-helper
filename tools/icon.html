<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:transparent;width:1024px;height:1024px;overflow:hidden}</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="80" y1="20" x2="960" y2="1020" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6D6AF4"/>
      <stop offset="0.48" stop-color="#5149D8"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.06" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="512" y1="160" x2="512" y2="870" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9E6FF"/>
    </linearGradient>
    <linearGradient id="clock" x1="370" y1="350" x2="670" y2="660" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5F58F0"/>
      <stop offset="1" stop-color="#3E34B7"/>
    </linearGradient>
    <filter id="shieldShadow" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#24165F" flood-opacity="0.3"/>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#glow)"/>
  <rect x="7" y="7" width="1010" height="1010" rx="226" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="6"/>
  <circle cx="210" cy="150" r="190" fill="#B6B2FF" opacity="0.18" filter="url(#softGlow)"/>

  <path d="M512 166 C 608 208 700 230 790 238 L 790 500 C 790 668 678 790 512 858 C 346 790 234 668 234 500 L 234 238 C 324 230 416 208 512 166 Z"
        fill="url(#shield)" filter="url(#shieldShadow)"/>

  <circle cx="512" cy="495" r="160" fill="url(#clock)"/>
  <circle cx="512" cy="495" r="160" fill="none" stroke="#ffffff" stroke-opacity="0.24" stroke-width="8"/>

  <g stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" opacity="0.9">
    <path d="M512 371v22"/>
    <path d="M636 495h-22"/>
    <path d="M512 619v-22"/>
    <path d="M388 495h22"/>
  </g>

  <g stroke="#FFFFFF" stroke-width="27" stroke-linecap="round">
    <path d="M512 495V402"/>
    <path d="M512 495l70 49"/>
  </g>
  <circle cx="512" cy="495" r="19" fill="#FFFFFF"/>

  <circle cx="790" cy="766" r="42" fill="#A9F2D2"/>
  <path d="m771 767 13 13 26-29" fill="none" stroke="#186B51" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
</body>
</html>
